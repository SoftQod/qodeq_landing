user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/xml;

    # Behind Cloudflare the TCP peer is a Cloudflare edge; take the client IP from CF-Connecting-IP
    # (trusted only from Cloudflare ranges, https://www.cloudflare.com/ips).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    upstream qodeq_contact_api {
        server contact-api:3001;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location / { return 301 https://$host$request_uri; }
    }

    # Unknown hosts get no certificate and no site
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_reject_handshake on;
    }

    # www -> без www: один адрес сайта для поисковиков (иначе весь сайт дублируется)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.qodeq.net;

        location / { return 301 https://qodeq.net$request_uri; }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name qodeq.net;

        root /usr/share/nginx/landing;
        index index.html;
        error_page 404 /404.html;

        # Чистые URL для главной и продуктовых страниц
        location = / { try_files /QODEQ.dc.html =404; }
        location = /chat { try_files /Product-Chat.dc.html =404; }
        location = /qa-chat { try_files /Product-QA-Chat.dc.html =404; }
        location = /payment { try_files /Product-Payment.dc.html =404; }
        location = /qa-call { try_files /Product-QA-Call.dc.html =404; }
        location = /voice { try_files /Product-Voice.dc.html =404; }

        # Старые .dc.html-адреса — 301 на чистые URL (не ломаем старые ссылки/закладки)
        location = /QODEQ.dc.html { return 301 /; }
        location = /Product-Chat.dc.html { return 301 /chat; }
        location = /Product-QA-Chat.dc.html { return 301 /qa-chat; }
        location = /Product-Payment.dc.html { return 301 /payment; }
        location = /Product-QA-Call.dc.html { return 301 /qa-call; }
        location = /Product-Voice.dc.html { return 301 /voice; }
        location = /QODEQ.ru.dc.html { return 301 /ru/; }
        location = /Product-Chat.ru.dc.html { return 301 /ru/chat; }
        location = /Product-QA-Chat.ru.dc.html { return 301 /ru/qa-chat; }
        location = /Product-Payment.ru.dc.html { return 301 /ru/payment; }
        location = /Product-QA-Call.ru.dc.html { return 301 /ru/qa-call; }
        location = /Product-Voice.ru.dc.html { return 301 /ru/voice; }

        # Дубли адресов — 301 на канонические
        location = /index.html { return 301 /; }
        location = /ru { return 301 /ru/; }
        location ~ ^(/ru)?/(chat|qa-chat|payment|qa-call|voice)/$ { return 301 $1/$2; }

        # RU-версии страниц (/ru/*)
        location = /ru/ { try_files /QODEQ.ru.dc.html =404; }
        location = /ru/chat { try_files /Product-Chat.ru.dc.html =404; }
        location = /ru/qa-chat { try_files /Product-QA-Chat.ru.dc.html =404; }
        location = /ru/payment { try_files /Product-Payment.ru.dc.html =404; }
        location = /ru/qa-call { try_files /Product-QA-Call.ru.dc.html =404; }
        location = /ru/voice { try_files /Product-Voice.ru.dc.html =404; }
        # ROI calculator (plain HTML pages)
        location = /calculator { try_files /Calculator.html =404; }
        location = /ru/calculator { try_files /Calculator.ru.html =404; }
        location = /Calculator.html { return 301 /calculator; }
        location = /Calculator.ru.html { return 301 /ru/calculator; }
        location = /privacy { try_files /privacy.html =404; }
        location = /ru/privacy { try_files /ru/privacy.html =404; }
        location ~ ^(/ru)?/privacy\.html$ { return 301 $1/privacy; }

        # Блог и обзорная страница (статика из build_blog.js): /blog, /blog/<slug>, /solutions/<slug> и /ru/...
        location ~ ^(/ru)?/blog/(index(\.html)?)?$ { return 301 $1/blog; }
        location = /blog { try_files /blog/index.html =404; }
        location = /ru/blog { try_files /ru/blog/index.html =404; }
        location ~ ^(/ru)?/(blog|solutions)/([a-z0-9-]+)\.html$ { return 301 $1/$2/$3; }
        location ~ ^(/ru)?/(blog|solutions)/([a-z0-9-]+)$ { try_files $1/$2/$3.html =404; }

        # Короткие ссылки для рекламных/тг-каналов: /tg/<метка> -> главная с готовыми UTM
        location ~ ^/tg/([a-zA-Z0-9_-]+)$ {
            return 302 /?utm_source=telegram&utm_medium=social&utm_campaign=$1;
        }

        location /api/ {
            proxy_pass http://qodeq_contact_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name demo.qodeq.net;

        root /usr/share/nginx/demo;
        index index.html;

        location / { try_files $uri $uri/ /index.html; }

        # A missing image must 404, not return the 2.6 MB page
        location /images/ {
            try_files $uri =404;
            expires 30d;
        }

        location = /index.html { add_header Cache-Control "no-cache"; }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name demo-voice.qodeq.net;

        root /usr/share/nginx/demo_voice;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name redoc.qodeq.net;

        root /usr/share/nginx/redoc;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
